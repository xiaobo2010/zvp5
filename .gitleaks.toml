[extend]
useDefault = true

[allowlist]
description = "Intentionally preserved, non-executable vulnerability archive"
paths = [
  '''reference/xuehai/''',
  '''adb2-wallet\.7z''',
  '''zvp5/zvp5-backend-python/\.venv/''',
  '''zvp5/zvp5-backend-python/tests/''',
  '''node_modules/''',
  '''dist/''',
  '''zvp5/zvp5-frontend/.*\.spec\.ts''',
]
regexes = [
  # 环境变量「名字」，不是值。改名成 ZVP5_ 之后 `generic-api-key` 规则会把
  # `_SECRET_ENV = "ZVP5_AI_KEY_SECRET"` 当成硬编码密钥报出来。
  '''ZVP5_AI_KEY_SECRET''',
]
