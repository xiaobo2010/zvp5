name: Feature request
description: 提议新的功能或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、接口或交互变化。
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 兼容性与风险
      description: 是否涉及数据库、权限、部署或已有 API？
