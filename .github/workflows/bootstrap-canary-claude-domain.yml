name: Bootstrap canary-claude custom domain

# 一次性：把 canary-claude.xiaoboisces.top 绑成 Worker zvp-yuren-canary-claude
# 的 custom domain。
#
# 为什么要单独一条流水线：`canary-anthropic` 通道自己的 environment 挂的是
# 本地那枚 Cloudflare 令牌，它没有创建 Worker custom domain 的权限
# （POST /accounts/{id}/workers/domains → 10405）。而 `canary` environment 里
# 那枚令牌可以——既有三个预览域（canary / canary2 / canary-pro）就是它建的。
# 所以这里借用 canary environment 的令牌把域名先绑上，之后 canary-anthropic
# 通道的常规部署（zone route）继续负责刷新静态产物。
#
# 手动触发：workflow_dispatch。跑完即可删。

on:
  workflow_dispatch:
  push:
    branches:
      - canary-anthropic
    paths:
      - ".github/workflows/bootstrap-canary-claude-domain.yml"

permissions:
  contents: read

concurrency:
  group: bootstrap-canary-claude
  cancel-in-progress: false

jobs:
  bind-domain:
    name: Bind custom domain via canary environment token
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: canary
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Create Worker custom domain
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          resp="$(curl -sS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -d '{"hostname":"canary-claude.xiaobopisces.top","service":"zvp-yuren-canary-claude","zone_id":"c4a321fb260ffc09d000112ac9b32b75"}')"
          echo "$resp" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if d.get('success'):
              r = d.get('result') or {}
              print('bound:', r.get('hostname'), '->', r.get('service'))
          else:
              print('FAILED:', json.dumps(d.get('errors'), ensure_ascii=False))
              raise SystemExit(1)
          "
      - name: Verify binding and DNS
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for r in d.get('result', []):
              if 'canary' in str(r.get('hostname')):
                  print(' ', r.get('hostname'), '->', r.get('service'))
          "
