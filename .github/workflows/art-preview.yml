name: Art preview (frontend -> Worker)

on:
  push:
    branches:
      - Art
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: art-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and deploy Art preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: canary-pro-auto
    defaults:
      run:
        working-directory: zvp5/zvp5-frontend-pro
    env:
      WRANGLER_VERSION: "4.162.0"
      CANARY_URL: https://canary-art.xiaobopisces.top
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version-file: zvp5/zvp5-frontend/.node-version
          cache: pnpm
          cache-dependency-path: zvp5/zvp5-frontend-pro/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Art preview bundle
        run: pnpm run build
      - name: Verify preview inputs
        working-directory: .
        run: |
          set -euo pipefail
          [[ -d zvp5/zvp5-frontend-pro ]] || {
            echo "zvp5/zvp5-frontend-pro is missing on $(git rev-parse --abbrev-ref HEAD)" >&2
            exit 1
          }
          [[ -f zvp5/deployment/preview-worker-canary-art/wrangler.jsonc ]] || {
            echo "preview worker config is missing" >&2
            exit 1
          }
      - name: Deploy to Cloudflare Worker
        working-directory: .
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy \
            --config zvp5/deployment/preview-worker-canary-art/wrangler.jsonc
      - name: Smoke test the deployed preview
        shell: bash
        run: |
          set -euo pipefail
          dist_dir=zvp5/zvp5-frontend-pro/dist
          entry="$(grep -o 'src="/assets/[^"]*"' "$dist_dir/index.html" | head -n1 | sed -e 's|src="||' -e 's|"$||')"
          [[ -n "$entry" ]] || { echo "could not find entry asset in $dist_dir/index.html" >&2; exit 1; }
          local_sha="$(sha256sum "$dist_dir$entry" | awk '{print $1}')"
          remote_sha="$(curl -fsS --compressed -H 'Accept-Encoding: gzip' "$CANARY_URL$entry" | sha256sum | awk '{print $1}')"
          [[ "$remote_sha" == "$local_sha" ]] || {
            echo "preview entry asset mismatch" >&2
            exit 1
          }
