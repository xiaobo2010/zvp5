name: Docs guard

# 纯文档改动不跑全量门禁（见 ci.yml 里 push 触发器的 paths-ignore），这里用一条
# 几十秒的任务兜底：只验证文档没把已脱敏的基础设施标识写回来。
#
# 故意不进 ruleset 的 required_status_checks：本工作流只在改 md/txt 时触发，
# 若设为 required，改代码的 PR 会永远等一个不会出现的检查。

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.txt"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.txt"

permissions:
  contents: read

concurrency:
  group: docs-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redaction:
    name: Docs redaction guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject re-introduced infrastructure identifiers
        run: |
          set -euo pipefail
          pattern='\b10\.0\.0\.[0-9]{1,3}\b|ap-chuncheon-1|gail\.ns\.cloudflare\.com|\b38\.175\.199\.192\b'
          if git grep -nE "$pattern" -- '*.md' '*.txt'; then
            echo "::error::文档里出现已脱敏的基础设施标识（内网地址 / OCI 区域 / 权威 NS / 后端公网 IP）。请改用 <INTERNAL_HOST> / <ADB_REGION> / <CF_NAMESERVER> / <BACKEND_IP>。"
            exit 1
          fi
          echo "no infrastructure identifiers found in docs"
