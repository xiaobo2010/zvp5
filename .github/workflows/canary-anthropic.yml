name: Canary Anthropic preview (frontend-canary → Worker)

# canary-anthropic 通道：全量门禁 + zvp5-frontend-canary 构建 + Worker 预览发布。
#
# 与 v5-canary 通道的差异只有「被部署的产物来源」：v5-canary 发 zvp5-frontend，
# 本通道发本分支自带的 zvp5-frontend-canary（全新前端，独立 lockfile）。
# 门禁 job（backend / frontend-e2e / workflow-security / dependency-security）
# 与 canary.yml 同构；预览 job 只换前端目录、构建断言与 Worker。
#
# 预览域：canary-claude.xiaoboisces.top（Worker: zvp-yuren-canary-claude）。
# 只发静态文件，不反代 API、不 SSH 任何主机、不碰数据库。
#
# 必需：canary-anthropic / canary-anthropic-auto environment 里的 secret
# CLOUDFLARE_API_TOKEN 与变量 CLOUDFLARE_ACCOUNT_ID（账号 ID 不写进仓库）。
#
# 安全策略与 canary 通道一致：token 所在的 environment 用「自定义分支策略」
# 限定只能从 canary-anthropic 分支的 job 取用；免审核放行的那个 environment
# 只在本分支创建者（分支作者）自己 push 时才被选中，其余推送一律落到带
# required_reviewers 的 environment，部署前人工放行。

on:
  push:
    branches:
      - canary-anthropic
    # 改代码就重新部署：只忽略纯文档，不用前端目录白名单。
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-anthropic-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION_FILE: zvp5/zvp5-frontend/.node-version
  PNPM_VERSION: "10.34.5"

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: zvp5/zvp5-backend-python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: zvp5/zvp5-backend-python/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.17.4
      - name: Generate local test keys
        run: python tools/setup_local.py
      - name: Ruff dead-code and undefined-name checks
        run: |
          python -m ruff check --select F821 .
          python -m ruff check --select F401 main.py app_setup.py routers services util db typings tasks tools
      - name: Run backend tests
        run: python -m pytest -q
      - name: Compile backend
        run: python -m compileall -q routers services util db typings tasks

  frontend-e2e:
    name: Frontend Cypress E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: zvp5/zvp5-frontend
    env:
      VITE_API_BASE: https://ci.invalid/api
      VITE_API_RACE_BASE: https://race.ci.invalid/api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: zvp5/zvp5-frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Cypress binary
        run: pnpm exec cypress install
      - name: Build bundle for E2E
        run: pnpm run build
      - name: Run Cypress
        run: pnpm run test:e2e

  workflow-security:
    name: Workflow and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck deployment scripts
        run: >-
          shellcheck -x
          zvp5/deployment/github-actions/zvp5-deploy
          zvp5/deployment/github-actions/*.sh
      - name: Test deployment backup and rollback paths
        run: bash zvp5/deployment/github-actions/test-deploy-wrapper.sh
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
      - name: Scan working tree for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0
          detect --source=/repo --no-git --config=/repo/.gitleaks.toml
          --redact --verbose --exit-code=1
      - name: Scan test fixtures for high-confidence credential formats
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0
          detect --source=/repo --no-git --config=/repo/.gitleaks-high-confidence.toml
          --enable-rule=private-key --enable-rule=aws-access-token
          --enable-rule=github-app-token --enable-rule=github-fine-grained-pat
          --enable-rule=github-oauth --enable-rule=github-pat
          --enable-rule=github-refresh-token --enable-rule=gitlab-pat
          --enable-rule=gitlab-oauth-app-secret
          --enable-rule=gitlab-runner-authentication-token
          --enable-rule=npm-access-token --enable-rule=pypi-upload-token
          --enable-rule=slack-app-token --enable-rule=slack-bot-token
          --enable-rule=slack-webhook-url --enable-rule=stripe-access-token
          --enable-rule=openai-api-key --enable-rule=anthropic-api-key
          --enable-rule=gcp-api-key --enable-rule=azure-ad-client-secret
          --enable-rule=cloudflare-api-key --enable-rule=cloudflare-global-api-key
          --redact --verbose --exit-code=1

  dependency-security:
    name: Dependency vulnerability checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Audit frontend-canary production dependencies
        working-directory: zvp5/zvp5-frontend-canary
        run: pnpm audit --prod --audit-level high
      - name: Scan repository dependencies for high and critical findings
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          aquasec/trivy:0.76.2 fs
          --scanners vuln --severity HIGH,CRITICAL
          --exit-code 1 --no-progress .

  preview:
    name: Frontend-canary gates and Worker preview
    needs:
      - backend
      - frontend-e2e
      - workflow-security
      - dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zvp5/zvp5-frontend-canary
    # token 存在 canary-anthropic* environment 里，两个 environment 的分支策略
    # 都只接受 canary-anthropic 分支的 job：
    #   - canary-anthropic      = 带 required_reviewers，部署前人工放行；
    #   - canary-anthropic-auto = 不放行闸，只给本分支创建者推的提交用。
    # 选择依据是 **github.actor（推送者身份）**，不是提交里的 author 字段：
    # author 是提交内容的一部分，任何人都能写别人的邮箱；actor 由 GitHub 认证，
    # 骗不了。
    # 为什么保留那道批准：有写权限的人能直接 push 到本分支（本分支没有 PR 门禁），
    # 也就能临时塞一个引用本 environment 的 workflow 去 echo token。分支策略挡不住
    # 「本分支推的东西」，只有人工放行能挡。
    # 门禁 job（backend / frontend-e2e / workflow-security / dependency-security）
    # 在批准之前就跑完，所以协作者仍能立刻看到代码质量结果，只有发布这一步等批。
    environment:
      name: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/canary-anthropic' && (github.actor == 'wzxundesigned' || github.actor == 'xiaobo2010' || github.actor == 'neiworldfirst1314-cell')) && 'canary-anthropic-auto' || 'canary-anthropic' }}
    env:
      WRANGLER_VERSION: "4.162.0"
      CANARY_URL: https://canary-claude.xiaoboisces.top
      # 后端盾牌会 418 掉没有 UA 的请求（curl 默认 UA 也在黑名单里），冒烟必须带这个。
      PROBE_UA: Mozilla/5.0 (compatible; ZVP5-Deploy/1.0)
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # 预览站跨域直连正式 API：CORS 白名单里必须已有 canary-claude 域。
      # frontend-canary 没有 race/content 两套基址，只有 VITE_API_BASE。
      VITE_API_BASE: ${{ vars.CANARY_API_BASE || 'https://zvp.xiaoboisces.top/api' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: zvp5/zvp5-frontend-canary/pnpm-lock.yaml
      - name: Verify preview frontend directory
        working-directory: .
        run: |
          [[ -d zvp5/zvp5-frontend-canary ]] || {
            echo "zvp5/zvp5-frontend-canary is missing on $(git rev-parse --abbrev-ref HEAD); this workflow only applies to the canary-anthropic branch" >&2
            exit 1
          }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm exec vitest run --reporter=dot
      - name: Lint
        run: pnpm run lint
      - name: Build preview bundle
        shell: bash
        run: |
          set -euo pipefail
          : "${VITE_API_BASE:?VITE_API_BASE is required}"
          # build = vue-tsc --noEmit && vite build，类型检查与产物在同一步完成。
          pnpm run build
          # 入口 chunk 必须真的产出了，避免只留下一个空壳 index.html。
          entry="$(grep -o 'src="/assets/[^"]*"' dist/index.html | head -n1 | sed -e 's|src="||' -e 's|"$||')"
          [[ -n "$entry" ]] || { echo "could not find entry asset in dist/index.html" >&2; exit 1; }
          [[ -f "dist$entry" ]] || { echo "entry chunk $entry missing" >&2; exit 1; }
          # API 基址必须落成绝对地址：这个前端默认回退到相对 '/api'，
          # 预览域下会被 SPA fallback 接走（200 + index.html），前端直接炸。
          grep -R -F -q "$VITE_API_BASE" dist/assets || {
            echo "built bundle does not contain the absolute API base $VITE_API_BASE" >&2
            exit 1
          }
      - name: Deploy to Cloudflare Worker
        shell: bash
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # 免审核通道（canary-anthropic-auto）挂着 token；人工放行通道
          # （canary-anthropic）刻意不挂——拿不到令牌就发不出去，等仓库所有者
          # 手动 workflow_dispatch 放行，这就是本通道的审批闸。
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is not available in this environment; ask the repo owner to approve this deployment (workflow_dispatch) or to push again from the branch owner}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy \
            --config zvp5/deployment/preview-worker-canary-claude/wrangler.jsonc
      - name: Smoke test the deployed preview
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          dist_dir=zvp5/zvp5-frontend-canary/dist
          entry="$(grep -o 'src="/assets/[^"]*"' "$dist_dir/index.html" | head -n1 | sed -e 's|src="||' -e 's|"$||')"
          [[ -n "$entry" ]] || { echo "could not find entry asset in dist/index.html" >&2; exit 1; }
          local_sha="$(sha256sum "$dist_dir$entry" | awk '{print $1}')"

          home_status=""
          waf_blocked=0
          for _ in $(seq 1 6); do
            home_status="$(curl -fsS -A "$PROBE_UA" -o /dev/null -w '%{http_code}' "$CANARY_URL/" || true)"
            if [[ "$home_status" == "403" ]]; then
              waf_blocked=1
              break
            fi
            remote_sha="$(curl -fsS -A "$PROBE_UA" --compressed -H 'Accept-Encoding: gzip' "$CANARY_URL$entry" | sha256sum | awk '{print $1}' || true)"
            if [[ "$home_status" == "200" && "$remote_sha" == "$local_sha" ]]; then
              break
            fi
            sleep 5
          done
          if [[ $waf_blocked -eq 1 ]]; then
            # Cloudflare 的托管规则会拦 GitHub Actions 出口 IP（同一地址用本机 curl
            # 是 200）。这是边缘策略不是部署问题，降级成警告，不做硬失败。
            echo "::warning title=Preview probe blocked by Cloudflare::canary-claude root returned 403 to the runner IP; content/CORS checks skipped."
            {
              echo '### Canary Anthropic preview deployed (probe skipped)'
              echo
              echo "- URL: $CANARY_URL"
              echo "- Commit: \`$GITHUB_SHA\`"
              echo "- Entry chunk: \`$entry\`"
              echo '- Content and CORS probes were skipped: Cloudflare returned 403 to the runner IP.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$home_status" == "200" ]] || { echo "preview root returned $home_status" >&2; exit 1; }
          [[ "$remote_sha" == "$local_sha" ]] || {
            echo "served $entry does not match the freshly built bundle" >&2
            exit 1
          }

          # 预览域不在后端 CORS 白名单时，页面能打开但所有 API 都会被 400 拒掉。
          # 不用 `curl -f`：被盾牌 418 / WAF 403 时需要读状态码决定「降级」而不是硬失败。
          cors_hdr="$(mktemp)"
          cors_status="$(curl -sS -A "$PROBE_UA" -D "$cors_hdr" -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H "Origin: $CANARY_URL" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            "$VITE_API_BASE/users/login" || echo 000)"
          cors_origin="$(tr -d '\r' < "$cors_hdr" | awk 'tolower($1) == "access-control-allow-origin:" {print $2}' | tail -n1)"
          rm -f "$cors_hdr"
          [[ "$cors_origin" == "$CANARY_URL" ]] || {
            # 没拿到任何 AC-AO 头也可能是边缘/盾牌拦了 CI 出口 IP；那种情况降级成警告，
            # 拿到「别的 Origin」才是真的白名单没配对。
            if [[ -z "$cors_origin" ]]; then
              echo "::warning title=CORS probe inconclusive::no access-control-allow-origin header (status $cors_status; backend shield or WAF may be blocking the runner IP)."
            else
              echo "backend CORS does not echo the preview origin (got '$cors_origin')" >&2
              exit 1
            fi
          }

          {
            echo '### Canary Anthropic preview deployed'
            echo
            echo "- URL: $CANARY_URL"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Entry chunk: \`$entry\`"
            echo '- Worker: zvp-yuren-canary-claude (zvp5-frontend-canary static assets)'
          } >> "$GITHUB_STEP_SUMMARY"
