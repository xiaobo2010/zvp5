name: Canary 3D concept (build)

# canary-3d 通道：只做构建门禁，不单独发布。
#
# 3D 概念版与 Pro 同源（挂在 /3d/），由 canary-pro 的 preview job 在部署 Pro
# 时把 zvp5-frontend-3d/dist 复制进 Pro 的静态产物一起发布。这个 workflow 只
# 负责在每次 3D 目录变更时快速跑一遍类型检查与构建，避免等到 20 分钟的完整
# 门禁才发现编译错误。

on:
  push:
    branches:
      - v5-canary-pro
    paths:
      - "zvp5/zvp5-frontend-3d/**"
      - ".github/workflows/canary-3d.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-3d-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION_FILE: zvp5/zvp5-frontend/.node-version
  PNPM_VERSION: "10.34.5"

jobs:
  build:
    name: Frontend 3D build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: zvp5/zvp5-frontend-3d
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: zvp5/zvp5-frontend-3d/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check and build
        # build = vue-tsc --noEmit && vite build；类型检查与产物同一步。
        run: pnpm run build
      - name: Assert bundle
        shell: bash
        run: |
          set -euo pipefail
          [[ -f dist/index.html ]] || { echo "dist/index.html missing" >&2; exit 1; }
          grep -F 'src="/3d/assets/' dist/index.html >/dev/null
          entry="$(grep -o 'src="/3d/assets/[^"]*"' dist/index.html | head -n1 | sed -e 's|src="||' -e 's|"$||')"
          [[ -n "$entry" ]] || { echo "could not find 3D entry asset" >&2; exit 1; }
          [[ -f "dist${entry#/3d}" ]] || { echo "entry chunk $entry missing" >&2; exit 1; }
