name: Canary CI and Worker preview deploy

# canary 通道与 main 完全隔离：
#   - 只跑质量门禁 + 前端预览部署，不碰任何后端主机、不执行 SSH、不碰数据库。
#   - 产物是纯静态前端，发到 Cloudflare Worker（zvp-yuren / canary.xiaobopisces.top），
#     页面里的 /api 指向正式 API 域，靠后端 CORS 白名单放行预览域。
#   - 正式发布仍由 ci.yml 的 release 门禁控制；这个文件不会部署生产。
#
# 必需仓库 Secret：CLOUDFLARE_API_TOKEN（Workers Scripts:Edit + Workers Routes:Edit）。
# 可选仓库 Variables：CLOUDFLARE_ACCOUNT_ID、CANARY_API_BASE、
# CANARY_API_RACE_BASE、CANARY_API_CONTENT_BASE。

on:
  push:
    branches:
      - v5-canary
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}
  # 快速连续推送时取消旧的一轮，省分钟数。代价：被取消的那轮若已在部署阶段，
  # 预览站可能停在上一版——下一次推送重发即可，预览站允许这种不精确。
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION_FILE: zvp5/zvp5-frontend/.node-version
  PNPM_VERSION: "10.34.5"

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: zvp5/zvp5-backend-python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: zvp5/zvp5-backend-python/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.17.4
      - name: Generate local test keys
        run: python tools/setup_local.py
      - name: Ruff dead-code and undefined-name checks
        run: |
          python -m ruff check --select F821 .
          python -m ruff check --select F401 main.py app_setup.py routers services util db typings tasks tools
      - name: Run backend tests
        run: python -m pytest -q
      - name: Compile backend
        run: python -m compileall -q routers services util db typings tasks

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zvp5/zvp5-frontend
    env:
      VITE_API_BASE: https://ci.invalid/api
      VITE_API_RACE_BASE: https://race.ci.invalid/api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: zvp5/zvp5-frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm exec vitest run --reporter=dot
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run type-check
      - name: Production build
        run: pnpm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: zvp5/zvp5-frontend/dist
          if-no-files-found: error
          retention-days: 3

  frontend-e2e:
    name: Frontend Cypress E2E
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zvp5/zvp5-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: zvp5/zvp5-frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Cypress binary
        run: pnpm exec cypress install
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: zvp5/zvp5-frontend/dist
      - name: Run Cypress
        run: pnpm run test:e2e

  workflow-security:
    name: Workflow and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck deployment scripts
        run: >-
          shellcheck -x
          zvp5/deployment/github-actions/zvms4-deploy
          zvp5/deployment/github-actions/*.sh
      - name: Test deployment backup and rollback paths
        run: bash zvp5/deployment/github-actions/test-deploy-wrapper.sh
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
      - name: Scan working tree for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0
          detect --source=/repo --no-git --config=/repo/.gitleaks.toml
          --redact --verbose --exit-code=1
      - name: Scan test fixtures for high-confidence credential formats
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0
          detect --source=/repo --no-git --config=/repo/.gitleaks-high-confidence.toml
          --enable-rule=private-key --enable-rule=aws-access-token
          --enable-rule=github-app-token --enable-rule=github-fine-grained-pat
          --enable-rule=github-oauth --enable-rule=github-pat
          --enable-rule=github-refresh-token --enable-rule=gitlab-pat
          --enable-rule=gitlab-oauth-app-secret
          --enable-rule=gitlab-runner-authentication-token
          --enable-rule=npm-access-token --enable-rule=pypi-upload-token
          --enable-rule=slack-app-token --enable-rule=slack-bot-token
          --enable-rule=slack-webhook-url --enable-rule=stripe-access-token
          --enable-rule=openai-api-key --enable-rule=anthropic-api-key
          --enable-rule=gcp-api-key --enable-rule=azure-ad-client-secret
          --enable-rule=cloudflare-api-key --enable-rule=cloudflare-global-api-key
          --redact --verbose --exit-code=1

  dependency-security:
    name: Dependency vulnerability checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      # 该任务只跑 pnpm audit（不做 pnpm install），没有 pnpm store 可缓存；
      # 开启 pnpm 缓存会让 setup-node 的 post 步骤因路径不存在而报错。
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
      - name: Audit frontend production dependencies
        working-directory: zvp5/zvp5-frontend
        run: pnpm audit --prod --audit-level high
      - name: Scan repository dependencies for high and critical findings
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          aquasec/trivy:0.76.2 fs
          --scanners vuln --severity HIGH,CRITICAL
          --exit-code 1 --no-progress .

  deploy-canary:
    name: Deploy canary Worker
    needs:
      - backend
      - frontend
      - frontend-e2e
      - workflow-security
      - dependency-security
    # 手工 dispatch 到别的分支时只跑门禁，不部署预览站。
    if: github.ref == 'refs/heads/v5-canary'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # token 存在 canary environment 里，且该 environment 只允许 v5-canary 分支访问；
    # 其他分支的 workflow 引用不到这把 Cloudflare token。
    environment: canary
    concurrency:
      group: canary-worker-deploy
      # 手动 dispatch 与 push 撞车时串行发布，避免两个 wrangler 同时上传。
      # 注意：工作流级 concurrency 仍可能取消正在跑的一轮，预览站重发即恢复。
      cancel-in-progress: false
    env:
      WRANGLER_VERSION: "4.162.0"
      CANARY_URL: https://canary.xiaobopisces.top
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '<CF_ACCOUNT_ID>' }}
      # 预览站跨域直连正式 API：CORS 白名单里必须已有 canary 域。
      VITE_API_BASE: ${{ vars.CANARY_API_BASE || 'https://zvp.xiaobopisces.top/api' }}
      VITE_API_RACE_BASE: ${{ vars.CANARY_API_RACE_BASE || 'https://zvpapi.xiaobopisces.top/api' }}
      VITE_API_CONTENT_BASE: ${{ vars.CANARY_API_CONTENT_BASE || 'https://zvp.xiaobopisces.top/api' }}
      # Worker 自己托管静态资源，所以资源基址是根路径；
      # PWA 的 start_url/scope 仍要锚在预览域上，不能落在 API 域。
      VITE_STATIC_BASE: /
      VITE_PAGE_BASE: https://canary.xiaobopisces.top/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: zvp5/zvp5-frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: zvp5/zvp5-frontend
        run: pnpm install --frozen-lockfile
      - name: Build preview bundle
        working-directory: zvp5/zvp5-frontend
        shell: bash
        run: |
          set -euo pipefail
          : "${VITE_API_BASE:?VITE_API_BASE is required}"
          : "${VITE_API_RACE_BASE:?VITE_API_RACE_BASE is required}"
          : "${VITE_API_CONTENT_BASE:?VITE_API_CONTENT_BASE is required}"
          : "${VITE_PAGE_BASE:?VITE_PAGE_BASE is required}"
          pnpm run build
          # 静态资源必须走预览域同源；混进绝对静态域说明 VITE_STATIC_BASE 没生效。
          grep -F 'src="/assets/' dist/index.html >/dev/null
          grep -R -F "$VITE_API_BASE" dist/assets >/dev/null
          grep -R -F "$VITE_API_RACE_BASE" dist/assets >/dev/null
          node - <<'NODE'
          const fs = require("node:fs")
          const pageBase = process.env.VITE_PAGE_BASE
          const manifest = JSON.parse(fs.readFileSync("dist/manifest.webmanifest", "utf8"))
          // v5-canary 尚未合入 VITE_PAGE_BASE 支持时，manifest 产出的是相对形式
          // （"/"）。按预览域解析后比较：既有变量时必须等于预览域，也不能落到别的域。
          const resolve = (value) => {
            try {
              return new URL(value, pageBase).href
            } catch {
              return null
            }
          }
          for (const key of ["start_url", "scope"]) {
            if (resolve(manifest[key]) !== pageBase) {
              throw new Error(`manifest ${key} must resolve to ${pageBase}, got ${manifest[key]}`)
            }
          }
          if ((manifest.icons || []).some((icon) => /^https:\/\//.test(String(icon.src)))) {
            throw new Error("manifest icons must stay on the preview origin")
          }
          NODE
      - name: Drop service worker from the preview bundle
        working-directory: zvp5/zvp5-frontend
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -f dist/sw.js dist/sw.js.map dist/workbox-*.js dist/workbox-*.js.map
          [[ ! -e dist/sw.js ]] || { echo "dist/sw.js still present" >&2; exit 1; }
      - name: Deploy to Cloudflare Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy \
            --config zvp5/deployment/preview-worker/wrangler.jsonc
      - name: Smoke test the deployed preview
        shell: bash
        run: |
          set -euo pipefail
          dist_dir=zvp5/zvp5-frontend/dist
          entry="$(grep -o 'src="/assets/[^"]*"' "$dist_dir/index.html" | head -n1 | sed -e 's|src="||' -e 's|"$||')"
          [[ -n "$entry" ]] || { echo "could not find entry asset in dist/index.html" >&2; exit 1; }
          local_sha="$(sha256sum "$dist_dir$entry" | awk '{print $1}')"

          home_status=""
          waf_blocked=0
          for _ in $(seq 1 6); do
            home_status="$(curl -fsS -o /dev/null -w '%{http_code}' "$CANARY_URL/" || true)"
            if [[ "$home_status" == "403" ]]; then
              waf_blocked=1
              break
            fi
            remote_sha="$(curl -fsS --compressed -H 'Accept-Encoding: gzip' "$CANARY_URL$entry" | sha256sum | awk '{print $1}' || true)"
            if [[ "$home_status" == "200" && "$remote_sha" == "$local_sha" ]]; then
              break
            fi
            sleep 5
          done
          if [[ $waf_blocked -eq 1 ]]; then
            # Cloudflare 的托管规则会拦 GitHub Actions 出口 IP（同一地址用本机 curl
            # 是 200）。这是边缘策略不是部署问题，降级成警告，不做硬失败。
            echo "::warning title=Preview probe blocked by Cloudflare::canary root returned 403 to the runner IP; content/CORS checks skipped."
            {
              echo '### Canary preview deployed (probe skipped)'
              echo
              echo "- URL: $CANARY_URL"
              echo "- Commit: \`$GITHUB_SHA\`"
              echo "- Entry chunk: \`$entry\`"
              echo '- Content and CORS probes were skipped: Cloudflare returned 403 to the runner IP.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$home_status" == "200" ]] || { echo "preview root returned $home_status" >&2; exit 1; }
          [[ "$remote_sha" == "$local_sha" ]] || {
            echo "served $entry does not match the freshly built bundle" >&2
            exit 1
          }

          # 预览站的 service worker 已被移除，`/sw.js` 应回落到 SPA 的 index.html；
          # 若仍返回 application/javascript，说明浏览器会跑旧的预缓存壳。
          sw_type="$(curl -fsS -o /dev/null -w '%{content_type}' "$CANARY_URL/sw.js" | tr -d '\r')"
          case "$sw_type" in
            text/html*) ;;
            *)
              echo "unexpected content-type for /sw.js: $sw_type" >&2
              exit 1
              ;;
          esac

          # 预览域不在后端 CORS 白名单时，页面能打开但所有 API 都会被 400 拒掉。
          cors_origin="$(curl -fsS -D- -o /dev/null -X OPTIONS \
            -H "Origin: $CANARY_URL" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            "$VITE_API_BASE/users/login" \
            | tr -d '\r' | awk 'tolower($1) == "access-control-allow-origin:" {print $2}' | tail -n1)"
          [[ "$cors_origin" == "$CANARY_URL" ]] || {
            # 没拿到任何 AC-AO 头也可能是 API 侧盾牌拦了 CI 出口 IP；那种情况降级成警告，
            # 拿到「别的 Origin」才是真的白名单没配对。
            if [[ -z "$cors_origin" ]]; then
              echo "::warning title=CORS probe inconclusive::no access-control-allow-origin header (backend shield may be blocking the runner IP)."
            else
              echo "backend CORS does not echo the preview origin (got '$cors_origin')" >&2
              exit 1
            fi
          }

          {
            echo '### Canary preview deployed'
            echo
            echo "- URL: $CANARY_URL"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Entry chunk: \`$entry\`"
            echo '- Worker: zvp-yuren (static assets only; no backend change was made)'
          } >> "$GITHUB_STEP_SUMMARY"
