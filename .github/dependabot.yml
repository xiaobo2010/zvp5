version: 2

updates:
  - package-ecosystem: pip
    directory: /zvp5/zvp5-backend-python
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      backend-patches:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /zvp5/zvp5-frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      frontend-patches:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Shanghai
    groups:
      # 只把小版本/补丁合成一个 PR；主版本单独开，避免一次跳 4 个大版本
      # （2026-11 曾发生 checkout v4→v7、upload-artifact v4→v7 等 6 个一次合并）。
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
