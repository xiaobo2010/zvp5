# Included from inside location /api/ on both frontend and backend.
#
# CORS preflights do not reach FastAPI. Unknown Origins receive a bodyless
# response without Access-Control-Allow-Origin, so browsers reject immediately.
if ($request_method = OPTIONS) {
    add_header Vary "Origin, Access-Control-Request-Method, Access-Control-Request-Headers" always;
    add_header Access-Control-Allow-Origin $zvms_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT" always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Access-Control-Max-Age "7200" always;
    return 204;
}
