# Allowed browser Origins for both LA and Seoul API entry points.
#
# Install as /etc/nginx/conf.d/zvms-cors-map.conf so the map lives in the http
# context. Keep this list synchronized with ZVMS_CORS_ALLOWED_ORIGINS.
map $http_origin $zvms_cors_origin {
    default "";
    "https://zvp.xiaobopisces.top" $http_origin;
    "https://zvpapi.xiaobopisces.top" $http_origin;
    "https://canary.xiaobopisces.top" $http_origin;
}
