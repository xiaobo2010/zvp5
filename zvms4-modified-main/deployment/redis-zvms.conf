# ZVMS4 生产 Redis 追加片段
#
# 用法：把下面「原样」粘到部署机 /etc/redis/redis.conf 的**末尾**（后面的行覆盖
# 前面的同名指令），然后 `systemctl restart redis-server`。
#
#   ssh zvp-backend 'sudo tee -a /etc/redis/redis.conf' < deployment/redis-zvms.conf
#   ssh zvp-backend 'sudo systemctl restart redis-server && redis-cli ping'
#
# 本机形态：只监听环回、无密码、单实例，不对外网开放。
# 键空间全是缓存 + 跨进程运行态，业务真相在 ADB；持久化只保证「重启不丢缓存」，
# 不保证「Redis 就是数据」。`redis-cli flushdb` 永远安全（见 docs/REDIS_STATE_DESIGN.md）。

bind 127.0.0.1 ::1
protected-mode yes

# 缓存总量上限：256MB 足够装下热点用户/班级/会话文档 + 运行态。
# allkeys-lru：到顶就淘汰最久未用的 key（epoch 计数器也可能被淘汰 —— 那只是
# 让「整类失效」回到 0，旧 key 靠 TTL 自然过期，不会读出错值）。
maxmemory 256mb
maxmemory-policy allkeys-lru

# 持久化：RDB + AOF 同时开。原先这里是 `save ""` + `appendonly no`（重启即空），
# 结果每次重启 epoch 归零、热缓存全冷，首屏与认证路径要在几秒内把 ADB 打满。
# 现在：AOF 负责「最近写不丢」（everysec 最多丢 1 秒），RDB 负责「启动更快 + 兜底
# 快照」。两者都不改变「Redis 可随时清空重建」的性质。
appendonly yes
appendfsync everysec
dir /var/lib/redis

# RDB 快照节奏（默认值，显式写出来便于 review）：
#   900 秒内 >=1 次写，或 300 秒内 >=10 次写，就落一份 dump.rdb。
# 注意：只要 `save` 里还有条目，就等于取消了 `save ""`；不要再追加 `save ""`。
save 900 1
save 300 10
