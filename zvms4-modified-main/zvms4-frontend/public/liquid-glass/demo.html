<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquid Glass Demo</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="glass.css" />
<style>
  html, body { margin: 0; background: #f5f6f8; font-family: system-ui, -apple-system, sans-serif; }
  .stage {
    position: relative;
    min-height: 100vh;
    background:
      radial-gradient(40% 50% at 18% 22%, rgba(120, 170, 245, .85), transparent 70%),
      radial-gradient(38% 44% at 82% 30%, rgba(255, 190, 130, .75), transparent 72%),
      radial-gradient(46% 50% at 58% 88%, rgba(170, 140, 240, .55), transparent 70%),
      linear-gradient(160deg, #eef3fb 0%, #f7f4ee 52%, #eef1f7 100%);
  }
  .topbar {
    position: fixed; inset: 0 0 auto 0; height: 72px;
    display: flex; align-items: center; gap: 14px; padding: 0 22px;
    z-index: 10;
  }
  .topbar__brand { font-weight: 600; font-size: 15px; color: #1c2430; margin-right: auto; }
  .pill-row { position: fixed; left: 24px; top: 120px; z-index: 10; }
  .panel-wrap { position: fixed; right: 40px; bottom: 60px; z-index: 10; }
  .copy { position: absolute; left: 24px; bottom: 40px; max-width: 520px; color: #26313f; }
  .copy h1 { font-size: 34px; margin: 0 0 8px; letter-spacing: -.02em; }
  .copy p { margin: 0; color: #59636f; line-height: 1.6; }
  .glass-button-text { color: #1b2430; font-weight: 500; }
  .glass-container .glass-button.is-active .glass-button-text { color: #0a5bd3; }
</style>
</head>
<body>
  <div class="stage">
    <div class="topbar" id="topbar"><span class="topbar__brand">义工平台</span></div>
    <div class="pill-row" id="pillrow"></div>
    <div class="panel-wrap" id="panel"></div>
    <div class="copy">
      <h1>Liquid Glass 真机验证</h1>
      <p>用库自带的 Container / Button 叠在渐变背景上，先确认折射、边缘光与嵌套玻璃在真实浏览器里能否达标。</p>
    </div>
  </div>
  <script src="html2canvas.min.js"></script>
  <script src="container.js"></script>
  <script src="button.js"></script>
  <script>
    window.glassControls = {
      edgeIntensity: 0.022, rimIntensity: 0.075, baseIntensity: 0.004,
      edgeDistance: 0.16, rimDistance: 0.9, baseDistance: 0.12,
      cornerBoost: 0.028, rippleEffect: 0.0, blurRadius: 7.0, tintOpacity: 0.05
    }

    const bar = new Container({ type: 'rounded', borderRadius: 22, tintOpacity: 0.04 })
    bar.element.style.width = '100%'
    bar.element.style.height = '64px'
    document.getElementById('topbar').appendChild(bar.element)

    const row = new Container({ type: 'pill', borderRadius: 999, tintOpacity: 0.05 })
    document.getElementById('pillrow').appendChild(row.element)
    ;['首页', '项目', '我的'].forEach((text, i) => {
      const btn = new Button({ text, size: 15, type: 'pill', tintOpacity: 0.03 })
      if (i === 0) btn.element.classList.add('is-active')
      row.addChild(btn)
    })

    const panel = new Container({ type: 'rounded', borderRadius: 26, tintOpacity: 0.07 })
    panel.element.style.width = '260px'
    panel.element.style.height = '150px'
    document.getElementById('panel').appendChild(panel.element)
    const circle = new Button({ text: '＋', size: 22, type: 'circle', tintOpacity: 0.06 })
    panel.addChild(circle)
  </script>
</body>
</html>
