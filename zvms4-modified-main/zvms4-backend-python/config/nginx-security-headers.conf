# ============================================================================
# ZVMS 安全响应头（nginx 片段）
# ----------------------------------------------------------------------------
# 由 `zvp.xiaobopisces.top` 的生产 vhost 引用/内联。放在 `http {}` 上下文里
# （宝塔面板 include 的 vhost 文件即处于 http 上下文，故 `map` 可合法放置）。
#
# 目标（对应平台加固设计）：
#   1. 外链/外网：CSP 阻断外部 script/style/connect，图片按设备分档
#   2. DNS 投毒：强制 HTTPS + HSTS（仿冒站点拿不到合法证书 → TLS 直接失败）
#   3. 降级面：80 端口仅保留 ACME 校验，其余 301 到 https
#
# 分档规则（`map $http_xuehai_id`）：
#   * 请求带 `Xuehai-Id`（学海设备）→ 收紧：img-src 不含 https:，外链图不加载
#   * 不带（非学海设备）        → 放行：img-src 允许 https:，外链图正常
#   CSP 中 `script-src`/`style-src` 保留 'unsafe-inline'：Vite 注入 4 段内联
#   引导脚本、Element Plus 注入内联样式，去掉会白屏。要更严可改用内联脚本的
#   sha256 哈希白名单（每次构建哈希变化，需随构建产物同步）。
# ============================================================================

map $http_xuehai_id $zvms_csp {
    # 默认（非学海设备）：放行外部图片
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'";

    # 学海设备（带头值）：收紧，不允许任何外部资源
    "~." "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'";
}

# 放进 server block（80 与 443 都放；HSTS 只放 443）
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Content-Security-Policy $zvms_csp always;

# 仅 443：
# add_header Strict-Transport-Security "max-age=31536000" always;
