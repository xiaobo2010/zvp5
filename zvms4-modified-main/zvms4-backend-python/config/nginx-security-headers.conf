# ============================================================================
# ZVMS 安全响应头（nginx 片段）
# ----------------------------------------------------------------------------
# 由生产 vhost 引用/内联。放在 `http {}` 上下文里
# （宝塔面板 include 的 vhost 文件即处于 http 上下文，故 `map` 可合法放置）。
#
# 目标（对应平台加固设计）：
#   1. 外链/外网：CSP 阻断外部 script/style/connect，图片按设备分档
#   2. DNS 投毒：强制 HTTPS + HSTS（仿冒站点拿不到合法证书 → TLS 直接失败）
#   3. 降级面：80 端口仅保留 ACME 校验，其余 301 到 https
#
# 分档规则（`map $http_xuehai_id`）：
#   * 请求带 `Xuehai-Id`（学海设备）→ 收紧：img-src 不含 https:，外链图不加载
#   * 不带（非学海设备）        → 放行：img-src 允许 https:，外链图正常
#   CSP（2026-10-23 安全报告整改）：
#   * `script-src` 不再含 'unsafe-inline'：构建期由前端
#     `scripts/vite-plugin-externalize-inline-scripts.ts` 把 index.html 的全部
#     内联脚本（plugin-legacy 的 4 段引导脚本）搬进外置文件，产物无内联脚本，
#     'self' 即可，也无需随构建维护 sha256 白名单。
#   * `style-src` 保留 'unsafe-inline'：运行时 style 属性（Element Plus popper
#     / Vue :style / html 根节点）+ legacy 产物运行时注入 <style> 元素，去掉
#     会让现代端样式失效、平板（legacy 路径）白屏；收紧需先移除 legacy 构建，
#     暂不做。
#   ⚠️ 上线顺序：先发新前端 dist，再改本 CSP 并 reload——旧 dist 仍带内联
#   脚本，先收紧会全站白屏。
# ============================================================================

map $http_xuehai_id $zvms_csp {
    # 默认（非学海设备）：放行外部图片
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://zvp.albwxy.fun wss://zvp.albwxy.fun; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'";

    # 学海设备（带头值）：收紧，不允许任何外部资源
    "~." "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://zvp.albwxy.fun wss://zvp.albwxy.fun; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'";
}

# 放进 server block（80 与 443 都放；HSTS 只放 443）
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Content-Security-Policy $zvms_csp always;

# 仅 443：
# add_header Strict-Transport-Security "max-age=31536000" always;
