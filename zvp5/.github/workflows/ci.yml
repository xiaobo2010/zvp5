name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zvp5/zvp5-backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: zvp5/zvp5-backend-python/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate local test keys
        run: python tools/setup_local.py
      - name: Run backend tests
        run: python -m pytest -q
      - name: Compile backend
        run: python -m compileall -q routers services util db typings tasks

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zvp5/zvp5-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: zvp5/zvp5-frontend/.node-version
          cache: pnpm
          cache-dependency-path: zvp5/zvp5-frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm exec vitest run
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run type-check
