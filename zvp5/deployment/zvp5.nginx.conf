# Content-host vhost for the ZVP5 SPA — 与生产 `zvp-backend:/etc/nginx/sites-enabled/zvp`
# 逐行同口径（2026-11-14 校对）。改这里之前先看线上那份，两边必须一起动。
#
# 依赖（由同机的 zvpapi vhost 提供，单独部署本文件时必须一并带上）：
#   * upstream `zvp5_api`、`$zvpapi_connection_upgrade`、`limit_req zone=zvp_api`
#   * `$zvp5_csp`（按设备能力两档的 CSP map）、`zvp_timed` 日志格式
#
# 不在本文件里：`albwxy.fun`（class-site）是另一套站点，vhost 在
# `/etc/nginx/sites-enabled/zvms4`，与本模板无关；`zvp.albwxy.fun` 是旧域名的
# 301 退休跳转，也在那份文件里。
#
# 为什么这些指令存在：
#   * `http2 on` 让一次页面加载的资源/API 复用一条 TLS 连接。WebSocket 不受影响：
#     浏览器固定用 HTTP/1.1 发 Upgrade 握手，同端口 ALPN 分流。
#   * `/api/` 走上游 `zvp5_api` 并清空 `Connection`，让 nginx→uvicorn 长连接生效；
#     不清理会把客户端的 close/keep-alive 透传，每个请求都新建后端 socket。
#   * `/index.html` 与 `/sw.js` 用 sub_filter 把 `/assets/` 改写到 zvpapi(前端)，
#     首屏资源绕开后端出网带宽瓶颈；页面本身与 API 仍是后端同源。
#   * `.webmanifest` 必须显式声明 mime，否则回 application/octet-stream，浏览器
#     拒绝解析，PWA 安装/图标/主题色全部失效。
#
# Requires nginx >= 1.25.1（`http2 on` 指令；旧的 `listen ... http2` 已弃用）。
# Debian 13 自带 1.26，BT 面板自带 1.28。

# zvp.xiaobopisces.top — 前端 SPA(2026-11-02 自前端迁入本机;DNS A 记录已翻转)。
# 机器本地端点(/system/ssh/*、/system/files/*)由前端 apiRouting.ts 路由到页面源
# (与 deployment/zvp5.nginx.conf 同口径):本机与后端同盒(127.0.0.1:8018),
# 零额外跳数;其余 API 仍由浏览器直连 https://zvpapi.xiaobopisces.top。
# CSP 复用 zvpapi vhost 中定义的 $zvp5_csp map(设备条件两档)与连接升级 map。

server {
    listen 80;
    listen [::]:80;
    server_name zvp.xiaobopisces.top;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # h2 只承载静态/API 传输；浏览器 WebSocket 握手固定走 h1.1，同端口 ALPN 分流。
    server_name zvp.xiaobopisces.top;

    # certbot 本地签发(2026-11-01 起,systemd 定时器自动续期)。
    ssl_certificate /etc/letsencrypt/live/zvp.xiaobopisces.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zvp.xiaobopisces.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZVP:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 文件管理器上传(/system/files/*)走本源,沿前端时代 100m 口径。
    keepalive_timeout 65;
    keepalive_requests 1000;

    client_max_body_size 100m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy $zvp5_csp always;

    root /www/zvp5/frontend-dist;
    index index.html;
    gzip_static on;

    # ---- 本机 API 反代(上游与参数与 zvpapi vhost 完全一致) ----

    # Web SSH 终端:必须显式升级;单独一条以保住其余 /api/ 的上游 keepalive。
    location = /api/system/ssh/ws {
        proxy_pass http://127.0.0.1:8018;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zvpapi_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /api/ {
        limit_req zone=zvp_api burst=60 nodelay;
        proxy_pass http://zvp5_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8018;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zvpapi_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ---- 静态 ----
    # 首屏关键资源（index-*.js / vendor / css / boot）改从 zvpapi(前端) 取，
    # 绕开后端出网带宽瓶颈。sub_filter 只重写 index.html 里的 /assets/ 引用，
    # 页面本身仍由后端出（同源 API、SW scope 不变）。
    location = /index.html {
        gzip_static off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        sub_filter_once off;
        sub_filter 'src="/assets/' 'src="https://zvpapi.xiaobopisces.top/assets/';
        sub_filter 'href="/assets/' 'href="https://zvpapi.xiaobopisces.top/assets/';
        try_files $uri =404;
    }

    # SW precache 清单也指向 zvpapi(前端)，避免后端再被拉一遍 3MB。
    # 只改写 assets/ 条目；index.html / manifest / 图标仍留后端（scope 相关）。
    location = /sw.js {
        gzip_static off;
        sub_filter_once off;
        sub_filter_types application/javascript;
        sub_filter 'url:"assets/' 'url:"https://zvpapi.xiaobopisces.top/assets/';
        try_files $uri =404;
    }

    # PWA 清单：nginx 默认 mime.types 不认 .webmanifest，会回 application/octet-stream，
    # 浏览器据此拒绝解析 manifest（PWA 安装/图标/主题色全部失效）。location 级 types
    # 只映射该目录内的文件，不影响其余静态资源。
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # 主题入口和深链接都回到该主题自己的 index.html。这里必须捕获 id：
    # 若统一回落 /index.html，刷新 /themes/<id>/me 会加载根 Canary。
    location ~ ^/themes/(?<theme_id>[a-z0-9-]+)(?:/.*)?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/index.html /themes/$theme_id/index.html =404;
    }

    location = /themes.json {
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    location ~ ^/theme-switcher\.(?:js|css)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/zvp.xiaobopisces.top.access.log zvp_timed;
    error_log /var/log/nginx/zvp.xiaobopisces.top.error.log;
}
