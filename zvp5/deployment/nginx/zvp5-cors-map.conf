# Allowed browser Origins for both frontend and backend API entry points.
#
# Install as /etc/nginx/conf.d/zvp5-cors-map.conf so the map lives in the http
# context. Keep this list synchronized with ZVP5_CORS_ALLOWED_ORIGINS.
map $http_origin $zvp5_cors_origin {
    default "";
    "https://zvp.xiaobopisces.top" $http_origin;
    "https://zvpapi.xiaobopisces.top" $http_origin;
    "https://canary.xiaobopisces.top" $http_origin;
    "https://canary-pro.xiaobopisces.top" $http_origin;
}
