# 2026-11-12 后端鲁棒性收口：nginx 层限流 + 带上游耗时的访问日志。
#
# 应用层限流仍在（登录 5/账号 + 60/IP/分、读 60/分、AI OCR 10/分、chat 20/分），
# 这里只做扫描/爬取的外层闸门，阈值刻意放宽，避免误伤校内 NAT 后面的正常用户：
#   zvp_api   30r/s + burst 60   —— 覆盖 /api/ 全量，够一个班级同时刷新页面
#   zvp_auth  120r/m + burst 30  —— 只给 POST /api/users/auth，比应用层更松
#
# 429 由 nginx 直接返回（日志里 ua=- 即未进上游），便于和应用的限流区分。
# 用法：放进 /etc/nginx/conf.d/（http 上下文），并在 vhost 的 location 里加 limit_req。

limit_req_zone $binary_remote_addr zone=zvp_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=zvp_auth:10m rate=120r/m;
limit_req_status 429;

# 排障用：请求总耗时 / 上游耗时 / 上游地址。缺这三列时，5xx 与慢请求只能靠
# 应用侧采样器还原，301/418 这类未进应用的请求完全看不到。
log_format zvp_timed '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time urt=$upstream_response_time ua=$upstream_addr';
