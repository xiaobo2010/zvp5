# Include from the static host's HTTPS server block.
# /assets/ already sets these in the production vhost; this exact location is
# needed because a cross-origin PWA manifest is fetched with credentials.

location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
    try_files $uri =404;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin $zvms_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;
}
