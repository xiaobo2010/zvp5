# Include from the static host's HTTPS server block (server context).
#
# Workbox precaches these files from the page origin with `credentials: include`
# (VitePWA `useCredentials: true`). A cross-origin credentialed fetch therefore
# needs both an exact Allow-Origin and Allow-Credentials on every response. The
# manifest link is also requested with `crossorigin="use-credentials"`.
#
# Nginx does not inherit parent `add_header` directives once a location declares
# its own, so each location restates the security headers it needs.

location = /index.html {
    try_files $uri =404;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Access-Control-Allow-Origin $zvp5_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;
}

location = /apple-touch-icon.png {
    try_files $uri =404;
    expires 1y;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin $zvp5_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;
}

location = /favicon.ico {
    try_files $uri =404;
    expires 1y;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin $zvp5_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;
}

location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
    try_files $uri =404;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin $zvp5_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;
}

location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin $zvp5_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Vary "Origin" always;
}
