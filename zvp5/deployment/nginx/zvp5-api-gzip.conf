# Dynamic API compression. Install as /etc/nginx/conf.d/zvp5-api-gzip.conf on
# the backend API host; the global http block already has `gzip on`.
#
# Deliberately omit text/event-stream and binary MIME types.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    application/json
    application/problem+json
    application/javascript
    text/javascript
    application/xml
    application/xml+rss
    text/xml;
